# Production overlay: pulls the image built by CI and puts Caddy in front
# for automatic HTTPS (Let's Encrypt).
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Requires DOMAIN and APP_IMAGE in .env, and ports 80/443 open to the host.

services:
  app:
    # Never build on the server; deploy exactly what CI tested.
    build: !reset null
    image: ${APP_IMAGE:?set APP_IMAGE in .env}
    pull_policy: always
    environment:
      SECURE_COOKIE: "true"
      TRUST_PROXY: "true"
    # Only Caddy talks to the app.
    ports: !reset []
    expose:
      - "4000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
