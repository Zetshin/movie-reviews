version: 2
# Dependabot only opens pull requests; a maintainer applies the update as
# their own commit (go get ... && go mod tidy) and closes the bot PR, so bot
# accounts never appear as commit authors. Updates are grouped into one PR
# per ecosystem to keep that manual step small.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      go-modules:
        patterns: ["*"]
    ignore:
      # scs tags its submodules as mysqlstore/vX.Y.Z; Dependabot resolves the
      # root module's v1.x tags instead and fails ("does not contain package").
      - dependency-name: github.com/alexedwards/scs/mysqlstore
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      docker-images:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
