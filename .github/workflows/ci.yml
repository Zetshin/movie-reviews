name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: movie-reviews:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start stack
        env:
          APP_IMAGE: movie-reviews:ci
          TMDB_API_KEY: ci-placeholder
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: Smoke test
        run: |
          set -e
          for path in /healthz / /movies/ /actors/ /user/login /static/css/site.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:4000$path")
            echo "$path -> $code"
            [ "$code" = "200" ]
          done
          # Directory listings must stay disabled.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/static/css/)" = "404" ]

      - name: Logs on failure
        if: failure()
        run: docker compose logs
        env:
          TMDB_API_KEY: x
          MYSQL_PASSWORD: x
          MYSQL_ROOT_PASSWORD: x

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: movie-reviews:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
