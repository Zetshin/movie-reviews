name: Deploy

# Deploy only after CI has passed on main, or manually from the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and push image
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Build exactly the commit that CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image reference
        id: ref
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          sha=$(git rev-parse --short=12 HEAD)
          {
            echo "repo=${REGISTRY}/${repo}"
            echo "sha=${sha}"
            echo "image=${REGISTRY}/${repo}:sha-${sha}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.ref.outputs.sha }}
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ steps.ref.outputs.repo }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: publish
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/movie-reviews' }}
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check deployment secrets
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$SSH_USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$KNOWN_HOSTS" ] || missing="$missing DEPLOY_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the server's host key instead of trusting it on first use.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload deployment files
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$SSH_USER@$HOST" "mkdir -p '$DEPLOY_PATH/hestia'"
          scp -i ~/.ssh/deploy_key -P "$PORT" deploy/hestia/docker-compose.yml deploy/hestia/deploy.sh "$SSH_USER@$HOST:$DEPLOY_PATH/"
          scp -i ~/.ssh/deploy_key -P "$PORT" deploy/hestia/install.sh deploy/hestia/docker-movieclub.tpl deploy/hestia/docker-movieclub.stpl "$SSH_USER@$HOST:$DEPLOY_PATH/hestia/"

      - name: Pull and restart
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The package may be private: log in with this run's short-lived
          # token (passed on stdin, never on the command line), pull, log out.
          # Run under sh explicitly: the login shell may be zsh, where
          # "status" is a read-only variable.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$PORT" "$SSH_USER@$HOST" \
            "sh -c 'docker login ghcr.io -u \"\$1\" --password-stdin >/dev/null && cd \"\$2\" && sh deploy.sh \"\$3\"; rc=\$?; docker logout ghcr.io >/dev/null; exit \$rc' deploy '$GHCR_USER' '$DEPLOY_PATH' '$IMAGE'"

      - name: Verify public health check
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for _ in 1 2 3 4 5 6; do
            if curl -fsS "$APP_URL/healthz"; then exit 0; fi
            sleep 10
          done
          echo "::error::$APP_URL/healthz did not return 200"
          exit 1

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
